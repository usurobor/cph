name: coherence

# Triggers coherence measurement on every tagged release.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install coh
        run: |
          mkdir -p "$HOME/.local/bin"
          BIN_DIR="$HOME/.local/bin" \
            curl -fsSL https://raw.githubusercontent.com/usurobor/tsc/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify coh
        run: coh --version

      - name: Run coherence measurement
        run: bash scripts/measure-coherence.sh

      - name: Upload coherence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coherence-reports-${{ github.ref_name }}
          path: .tsc/
          if-no-files-found: warn
          retention-days: 90
